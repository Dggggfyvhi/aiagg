    <script>
      /* ===================================================================
       *  Nexora 内联拦截 —— 唯一改动，写在 index.html 里，不依赖任何外部文件
       *  作用：点「开始使用 / 开始创作」时跳转到 login.html，
       *        而不是进入原版那个需要后端、会报「模型列表加载失败」的控制台。
       *  安全：不联网、不上传、不 eval，只做本地跳转。
       * =================================================================== */
      (function () {
        'use strict';
        console.log('[Nexora] 内联拦截已加载');

        var TARGET = 'login.html';                  // ← 想换页面改这里
        var KEYS = ['开始使用', '开始创作', '立即开始', '马上开始', '立即体验', 'get started', 'start now'];
        var DEAD = ['模型列表加载失败', '参与模型'];  // 死壳特征词，出现就自动逃生

        var last = 0;   // 只做 0.8 秒防连点，绝不永久锁死

        function go(reason) {
          var now = Date.now();
          if (now - last < 800) return;
          last = now;
          console.log('[Nexora] 跳转：' + reason);
          location.href = TARGET;
        }

        function match(el) {
          if (!el || el.nodeType !== 1) return false;
          var t = (el.textContent || '').trim().toLowerCase();
          for (var i = 0; i < KEYS.length; i++) {
            if (t.indexOf(KEYS[i]) !== -1) return true;
          }
          return false;
        }

        function scan() {
          var t = (document.body && document.body.innerText) || '';
          for (var i = 0; i < DEAD.length; i++) {
            if (t.indexOf(DEAD[i]) !== -1) { go('检测到死壳：' + DEAD[i]); return; }
          }
        }

        /* 点击拦截：捕获阶段，抢在原版框架之前 */
        document.addEventListener('click', function (e) {
          var el = e.target;
          for (var i = 0; i < 10 && el; i++) {
            if (match(el)) {
              if (e.cancelable) e.preventDefault();
              e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              go('点击按钮');
              return;
            }
            el = el.parentElement;
          }
        }, true);

        function watch() {
          scan();
          new MutationObserver(scan).observe(document.body, { childList: true, subtree: true, characterData: true });
          setInterval(scan, 400);
        }
        if (document.body) watch();
        else document.addEventListener('DOMContentLoaded', watch);

        /* 关键修复：从返回缓存恢复（刷新/返回/退出再回来）时解锁，按钮立刻恢复可用 */
        window.addEventListener('pageshow', function (e) {
          last = 0;
          console.log('[Nexora] 页面恢复，已解锁（persisted=' + e.persisted + '）');
        });
      })();
    </script>
